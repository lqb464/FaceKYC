[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "facekyc"
version = "1.0.0"
description = "Research-grade 1:1 face verification and passive presentation-attack decision support"
requires-python = ">=3.11,<3.14"
readme = "README.md"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.26,<3",
    "Pillow>=10.0,<13",
    "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
vision = [
    "torch>=2.2,<3",
    "torchvision>=0.17,<1",
    "facenet-pytorch>=2.6,<3",
    "opencv-python-headless>=4.9,<5",
]
api = [
    "fastapi>=0.115,<1",
    "python-multipart>=0.0.12,<1",
    "uvicorn[standard]>=0.30,<1",
]
frontend = [
    "requests>=2.32,<3",
    "streamlit>=1.40,<2",
]
notebooks = [
    "jupyter>=1.0,<2",
    "ipykernel>=6.29,<7",
    "matplotlib>=3.8,<4",
    "pandas>=2.2,<3",
    "scikit-learn>=1.4,<2",
    "seaborn>=0.13,<1",
    "tqdm>=4.66,<5",
]
tracking = ["mlflow>=2.20,<4"]
dev = [
    "httpx>=0.27,<1",
    "pytest>=8.0,<9",
    "pytest-cov>=5.0,<8",
    "ruff>=0.8,<1",
]

[project.scripts]
facekyc-validate = "facekyc.console:validate_main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["facekyc*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --tb=short --basetemp=.pytest-tmp"
