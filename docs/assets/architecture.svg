<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="370" viewBox="0 0 1120 370" role="img" aria-labelledby="title desc">
  <title id="title">FaceKYC inference and governance architecture</title>
  <desc id="desc">Raw ID and selfie images flow through input validation, quality checks, face detection, passive PAD, face matching and policy decisions. Aggregate results feed privacy-safe monitoring. A checksummed candidate bundle supplies models and locked thresholds.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#49616b"/></marker>
    <style>.box{fill:#f5fafb;stroke:#2a6670;stroke-width:2;rx:12}.gate{fill:#fff7e8;stroke:#b46812;stroke-width:2;rx:12}.gov{fill:#eef2ff;stroke:#4b5dbb;stroke-width:2;rx:12}.t{font:600 15px system-ui;fill:#17323a;text-anchor:middle}.s{font:12px system-ui;fill:#49616b;text-anchor:middle}.a{stroke:#49616b;stroke-width:2;fill:none;marker-end:url(#arrow)}</style>
  </defs>
  <rect width="1120" height="370" fill="white"/>
  <rect class="box" x="25" y="75" width="130" height="80"/><text class="t" x="90" y="108">ID + selfie</text><text class="s" x="90" y="132">JPEG/PNG/WEBP</text>
  <rect class="gate" x="195" y="75" width="130" height="80"/><text class="t" x="260" y="105">Input guard</text><text class="s" x="260" y="128">size, format,</text><text class="s" x="260" y="145">quality</text>
  <rect class="box" x="365" y="75" width="130" height="80"/><text class="t" x="430" y="105">MTCNN</text><text class="s" x="430" y="128">detect + align</text><text class="s" x="430" y="145">one face</text>
  <rect class="box" x="535" y="25" width="150" height="80"/><text class="t" x="610" y="57">PAD proxy</text><text class="s" x="610" y="80">MobileNetV3</text><text class="s" x="610" y="97">bona-fide score</text>
  <rect class="box" x="535" y="130" width="150" height="80"/><text class="t" x="610" y="162">FaceNet</text><text class="s" x="610" y="185">two embeddings</text><text class="s" x="610" y="202">cosine similarity</text>
  <rect class="gate" x="735" y="75" width="155" height="80"/><text class="t" x="812" y="105">Decision policy</text><text class="s" x="812" y="128">thresholds +</text><text class="s" x="812" y="145">uncertainty bands</text>
  <rect class="box" x="940" y="75" width="150" height="80"/><text class="t" x="1015" y="103">API / batch</text><text class="s" x="1015" y="126">decision + reason</text><text class="s" x="1015" y="143">no biometrics stored</text>
  <path class="a" d="M155 115H195"/><path class="a" d="M325 115H365"/><path class="a" d="M495 105L535 70"/><path class="a" d="M495 125L535 165"/><path class="a" d="M685 65L735 105"/><path class="a" d="M685 170L735 130"/><path class="a" d="M890 115H940"/>
  <rect class="gov" x="365" y="270" width="320" height="70"/><text class="t" x="525" y="298">Checksummed model bundle</text><text class="s" x="525" y="320">architecture · thresholds · metrics · governance status</text>
  <path class="a" d="M525 270V220L610 210"/>
  <rect class="gov" x="760" y="270" width="300" height="70"/><text class="t" x="910" y="298">Privacy-safe monitoring</text><text class="s" x="910" y="320">counts · score summaries · warning rate</text>
  <path class="a" d="M1015 155V245L945 270"/>
</svg>
